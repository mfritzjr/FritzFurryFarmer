<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fritz' Furry Farmer - Leaderboard</title>

    <style>
        :root {
            --cream: #fff9e9;
            --green: #365d40;
            --light-green: #e5eedb;
            --brown: #72533b;
            --text: #37352e;

            --gold: #c28a14;
            --silver: #788592;
            --bronze: #a96431;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: 'Trebuchet MS', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Same navbar as development page */

        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
            background: var(--green);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #f9dc8e;
        }

        /* Page heading */

        .page-header {
            text-align: center;
            padding: 65px 20px 35px;
            background: var(--light-green);
        }

        .eyebrow {
            color: #7b8e46;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        .page-header h1 {
            color: var(--green);
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            margin: 12px 0;
        }

        .page-header p {
            color: var(--brown);
            margin: 0;
        }

        /* Main content layout */

        .leaderboard-layout {
            max-width: 1250px;
            margin: 60px auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 55px;
        }

        /* Leaderboard card */

        .leaderboard-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border: 3px solid #c7d9b8;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .leaderboard-header {
            padding: 22px 28px;
            background: var(--green);
            color: white;
        }

        .leaderboard-header h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 16px 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--green);
            background: var(--light-green);
        }

        td {
            padding: 16px 20px;
            font-size: 1rem;
            border-bottom: 1px solid #e9e6da;
            transition: background 0.15s ease;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: #f0f5e9;
        }

        /* Column styling */

        .col-rank {
            width: 100px;
            font-weight: 700;
            color: var(--brown);
        }

        .col-player {
            font-weight: 600;
        }

        .col-score {
            text-align: right;
            font-weight: 700;
            color: var(--green);
            font-variant-numeric: tabular-nums;
        }

        th:last-child {
            text-align: right;
        }

        /* Gold, silver, bronze */

        tbody tr:nth-child(1) {
            background: #fff4cc;
        }

        tbody tr:nth-child(1) .col-rank {
            color: var(--gold);
        }

        tbody tr:nth-child(2) {
            background: #f0f2f4;
        }

        tbody tr:nth-child(2) .col-rank {
            color: var(--silver);
        }

        tbody tr:nth-child(3) {
            background: #f8e9db;
        }

        tbody tr:nth-child(3) .col-rank {
            color: var(--bronze);
        }

        /* Dancing cat sprite */

        .cat-container {
            flex: 0 0 272px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sprite {
            width: 271.5px;
            height: 724px;

            background-image:
                url('./assets/images/cat_dance.png');

            background-repeat: no-repeat;

            animation: play 2s steps(8) infinite;

            image-rendering: pixelated;
        }

        @keyframes play {
            from {
                background-position: 0px 0px;
            }

            to {
                background-position: -2172px 0px;
            }
        }

        .cat-caption {
            color: var(--brown);
            font-weight: bold;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 30px;
            background: var(--green);
            color: white;
            margin-top: 60px;
        }

        /* Responsive layout */

        @media (max-width: 900px) {
            .leaderboard-layout {
                flex-direction: column;
                gap: 30px;
            }

            .cat-container {
                flex-basis: auto;
            }
        }

        @media (max-width: 500px) {
            .navbar {
                gap: 15px;
            }

            th, td {
                padding: 12px 10px;
                font-size: 0.85rem;
            }

            .col-rank {
                width: 65px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">
        <a href="index.html">Play Game</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="development.html">Build Process</a>
        <a href="essay.html">Essay</a>
    </nav>

    <!-- Heading -->

    <header class="page-header">
        <span class="eyebrow">HALL OF FAME</span>

        <h1>Fritz' Furry Farmer Leaderboard</h1>

        <p>
            The finest farmers in the field!
        </p>
    </header>

    <!-- Leaderboard and dancing cat -->

    <main class="leaderboard-layout">

        <section class="leaderboard-card">
            <div class="leaderboard-header">
                <h2>Top Farmers</h2>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player Name</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody id="scores">
                    <tr>
                        <td colspan="3">
                            Loading scores...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Dancing cat -->

        <div class="cat-container">
            <div
                class="sprite"
                role="img"
                aria-label="Farmer dancing">
            </div>

            <p class="cat-caption">
                Farmer Cat celebrates the top farmers!
            </p>
        </div>

    </main>

    <footer>
        <p>Fritz' Furry Farmer — Hall of Fame</p>
    </footer>

    <!-- Supabase leaderboard -->

    <script type="module">
        import { getLeaderboard }
            from './src/leaderboardService.js';

        async function displayLeaderboard() {
            const table = document.getElementById('scores');

            if (!table) {
                console.error(
                    'Cannot find element with id="scores"'
                );
                return;
            }

            try {
                const scores = await getLeaderboard();

                table.replaceChildren();

                if (scores.length === 0) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');

                    cell.colSpan = 3;
                    cell.textContent = 'No scores yet!';

                    row.appendChild(cell);
                    table.appendChild(row);
                    return;
                }

                scores.forEach((player, index) => {
                    const row = document.createElement('tr');

                    const rank = document.createElement('td');
                    const name = document.createElement('td');
                    const score = document.createElement('td');

                    rank.className = 'col-rank';
                    name.className = 'col-player';
                    score.className = 'col-score';

                    const medals = ['🥇', '🥈', '🥉'];

                    rank.textContent = index < 3
                        ? `${medals[index]} ${index + 1}`
                        : index + 1;

                    name.textContent = player.player_name;
                    score.textContent = player.score;

                    row.append(rank, name, score);
                    table.appendChild(row);
                });

                } catch (error) {
                    console.error('Leaderboard error:', error);

                    const row = document.createElement('tr');
                    const cell = document.createElement('td');

                    cell.colSpan = 3;
                    cell.textContent = 'Unable to load scores.';

                    row.appendChild(cell);
                    table.replaceChildren(row);
                }
        }

            displayLeaderboard();
    </script>

    </body>
</html>
