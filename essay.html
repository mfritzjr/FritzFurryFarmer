
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    /* development.css */ 
    
    :root {
            --cream: #fff9e9;
            --green: #365d40;
            --light-green: #e5eedb;
            --brown: #72533b;
            --text: #37352e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: 'Trebuchet MS', sans-serif;
            line-height: 1.8;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
            background: var(--green);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #f9dc8e;
        }

        .chapter {
            color: #7b8e46;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 2rem;
        }

        .background-image {
            background: var(--light-green);
            border: 3px solid #c7d9b8;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
        }

        .background-image img {
            display: block;
            width: 100%;
            max-height: 800px;
            object-fit: contain;
            image-rendering: pixelated;
        }
    /* PDF Viewer */
    .pdf-section {
        text-align: center;
        padding: 80px 20px;
        
        border-bottom: 1px solid #e2ddca;
    }

    .pdf-section h2 {
        color: var(--green);
        font-size: 2.5rem;
        margin-bottom: 15px;
    }

    .pdf-viewer {
        max-width: 850px;
        margin: 35px auto;
        padding: 20px;
        background: #e5eedb;
        border: 3px solid #c7d9b8;
        border-radius: 18px;
    }

    #pdf-canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        background: white;
        box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .pdf-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        flex-wrap: wrap;
        margin-top: 20px;
        color: var(--green);
        font-weight: bold;
    }

    .pdf-controls button {
        background: var(--green);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        font-weight: bold;
    }

    .pdf-controls button:hover:not(:disabled) {
        background: #527e58;
    }

    .pdf-controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    </style>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Essay | Fritz IDS4939 Final Project 11/2026</title>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Play Game</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="development.html">Build Process</a>
        <a href="essay.html">Essay</a>
    </nav>

<main>
    <section class="pdf-section">
        <span class="chapter">Final Project Essay</span>
            <div class="pdf-viewer">
                <canvas id="pdf-canvas"></canvas>
        
                <div class="pdf-controls">
                    <button id="prev-page">← Previous</button>
        
                    <span>
                        Page <span id="page-num">1</span>
                        of <span id="page-count">--</span>
                    </span>
        
                    <button id="next-page">Next →</button>
                </div>
            </div>
        </section>
        <script type="module">
            import * as pdfjsLib from
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
        
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
        
            const pdfPath = './assets/images/Fritz_IDS_4939_Final_Project_11_2026.pdf';
        
            let pdfDoc = null;
            let pageNum = 1;
            let pageRendering = false;
            let pendingPage = null;
        
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d');
        
            const prevButton = document.getElementById('prev-page');
            const nextButton = document.getElementById('next-page');
        
            async function renderPage(num) {
                pageRendering = true;
        
                try {
                    const page = await pdfDoc.getPage(num);
        
                    const baseViewport = page.getViewport({ scale: 1 });
                    const containerWidth =
                        canvas.parentElement.clientWidth - 40;
        
                    const scale = Math.min(
                        1.5,
                        containerWidth / baseViewport.width
                    );
        
                    const viewport = page.getViewport({ scale });
        
                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
        
                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;
        
                    document.getElementById('page-num').textContent = num;
        
                    prevButton.disabled = num <= 1;
                    nextButton.disabled = num >= pdfDoc.numPages;
                } catch (error) {
                    console.error('Error rendering PDF page:', error);
                } finally {
                    pageRendering = false;
        
                    if (pendingPage !== null) {
                        const next = pendingPage;
                        pendingPage = null;
                        renderPage(next);
                    }
                }
            }
        
            function queueRenderPage(num) {
                if (pageRendering) {
                    pendingPage = num;
                } else {
                    renderPage(num);
                }
            }
        
            prevButton.addEventListener('click', () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            });
        
            nextButton.addEventListener('click', () => {
                if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            });
        
            try {
                pdfDoc = await pdfjsLib.getDocument(pdfPath).promise;
        
                document.getElementById('page-count').textContent =
                    pdfDoc.numPages;
        
                renderPage(pageNum);
            } catch (error) {
                console.error('Could not load PDF:', error);
            }
        </script>
    </main>

    <footer>
        <p>Fritz IDS 4939 Final Project 11/2026</p>
    </footer>

</body>
</html>
